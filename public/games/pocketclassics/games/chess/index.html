<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chess Master | Pocket Classics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Audio Elements -->
    <audio id="sound-move" src="sounds/move.wav" preload="auto"></audio>
    <audio id="sound-capture" src="sounds/capture.wav" preload="auto"></audio>
    <audio id="sound-check" src="sounds/check.wav" preload="auto"></audio>
    <audio id="sound-game-over" src="sounds/game-over.wav" preload="auto"></audio>
    <audio id="sound-ui-click" src="sounds/ui_click.wav" preload="auto"></audio>
    <audio id="sound-game-start" src="sounds/game_start.wav" preload="auto"></audio>
    <audio id="sound-castling" src="sounds/castling.wav" preload="auto"></audio>
    <audio id="sound-promotion" src="sounds/promotion.wav" preload="auto"></audio>
    <audio id="sound-select" src="sounds/select.wav" preload="auto"></audio>
    <audio id="sound-invalid" src="sounds/invalid.wav" preload="auto"></audio>
    <audio id="music-menu" src="sounds/menu-music.mp3" preload="auto" loop></audio>
    <audio id="music-game" src="sounds/game-music.mp3" preload="auto" loop></audio>

    <div class="chess-app-wrapper">
        <!-- 1. Main Menu Screen -->
        <div id="main-menu" class="card-screen">
            <div class="menu-brand">
                <span class="game-badge">POCKET CLASSICS</span>
                <h1 class="neon-title">CHESS</h1>
                <p class="tagline">The ultimate strategy of Kings, Queens &amp; Pawns</p>
            </div>

            <div class="menu-actions">
                <button id="play-player" class="arc-btn-primary">
                    <i class="fas fa-user-friends"></i> <span>2 Players Local</span>
                </button>
                
                <div class="ai-select-card">
                    <button id="play-ai" class="arc-btn-secondary">
                        <i class="fas fa-robot"></i> <span>Play against AI</span>
                    </button>
                    <div id="ai-difficulty-selector" class="hidden diff-selector-drawer">
                        <div class="drawer-header">Select Engine Strength:</div>
                        <div class="diff-btn-group">
                            <button class="ai-lvl-btn active" data-level="easy">Novice</button>
                            <button class="ai-lvl-btn" data-level="medium">Master</button>
                            <button class="ai-lvl-btn" data-level="hard">Grandmaster</button>
                        </div>
                        <button id="start-ai-game" class="arc-btn-accent">
                            <i class="fas fa-play"></i> <span>Start Match</span>
                        </button>
                    </div>
                </div>

                <button id="settings-button" class="arc-btn-secondary">
                    <i class="fas fa-sliders-h"></i> <span>Settings</span>
                </button>
            </div>

            <div class="input-hints-bar">
                <span class="hint-pill"><i class="fas fa-mouse-pointer"></i> Tap / Click</span>
                <span class="hint-pill"><i class="fas fa-keyboard"></i> Arrows / WASD</span>
                <span class="hint-pill"><i class="fas fa-gamepad"></i> Gamepad Grid</span>
            </div>
        </div>

        <!-- 2. Active Game Screen -->
        <div id="game-container" class="hidden">
            <header class="game-hud">
                <div class="hud-left">
                    <button id="back-to-menu" class="hud-icon-btn" title="Back to Menu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div id="status" class="turn-indicator">White to Move</div>
                </div>

                <div class="hud-right">
                    <button id="restart-match-btn" class="hud-icon-btn" title="Restart Game">
                        <i class="fas fa-rotate-right"></i>
                    </button>
                </div>
            </header>

            <!-- Scoreboard Comparison -->
            <div class="score-strip" id="chess-score-strip">
                <div class="score-card player-w">
                    <span class="score-label">WHITE (P1)</span>
                    <span class="score-val" id="score-white">0</span>
                </div>
                <div class="score-card ties">
                    <span class="score-label">DRAWS</span>
                    <span class="score-val" id="score-draws">0</span>
                </div>
                <div class="score-card player-b">
                    <span class="score-label" id="label-black">BLACK (P2)</span>
                    <span class="score-val" id="score-black">0</span>
                </div>
            </div>

            <div id="board-container" class="board-frame">
                <div id="board"></div>
            </div>

            <footer class="game-footer-hint">
                <span id="hint-text"><i class="fas fa-info-circle"></i> Tap a piece to highlight legal moves</span>
            </footer>
        </div>

        <canvas id="confetti-canvas"></canvas>

        <!-- 3. Promotion Dialog -->
        <div id="promotion-dialog" class="modal-overlay hidden">
            <div class="modal-card">
                <h3 class="modal-headline" style="font-size: 1.25rem;">Promote Pawn</h3>
                <p class="tagline" style="margin-bottom: 16px;">Select rank promotion piece:</p>
                <div class="promotion-btn-grid">
                    <button class="promo-choice-btn" data-piece="q" title="Queen">
                        <i class="fas fa-chess-queen"></i>
                        <span>Queen</span>
                    </button>
                    <button class="promo-choice-btn" data-piece="r" title="Rook">
                        <i class="fas fa-chess-rook"></i>
                        <span>Rook</span>
                    </button>
                    <button class="promo-choice-btn" data-piece="b" title="Bishop">
                        <i class="fas fa-chess-bishop"></i>
                        <span>Bishop</span>
                    </button>
                    <button class="promo-choice-btn" data-piece="n" title="Knight">
                        <i class="fas fa-chess-knight"></i>
                        <span>Knight</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 4. Settings Modal -->
        <div id="settings-dialog" class="modal-overlay hidden">
            <div class="modal-card">
                <h2 class="modal-headline">Settings</h2>
                <div class="settings-list">
                    <div class="setting-row">
                        <span><i class="fas fa-music"></i> Music</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="music-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-row">
                        <span><i class="fas fa-volume-high"></i> SFX</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="sfx-toggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <button id="close-settings-button" class="arc-btn-secondary" style="margin-top: 18px; width: 100%;">
                    <i class="fas fa-check"></i> <span>Done</span>
                </button>
            </div>
        </div>
    </div>

    <script src="../../js/protection.js"></script>
    <script src="../../js/arcade-helper.js"></script>
    <script src="script.js"></script>
</body>
</html>
